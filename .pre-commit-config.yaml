repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.7
  hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]
  
- repo: local
  hooks:
    - id: frontend-lint-staged
      name: Run frontend lint-staged
      # Uncomment this line if running on macOS or Linux
      # entry: bash -c "cd frontend && npx run lint-staged --no-stash --quiet"
      # Uncommnet this line if running on Windows
      entry: pwsh -Command "cd frontend && npx run lint-staged --no-stash --quiet"
      language: system
      pass_filenames: false