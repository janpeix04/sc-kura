repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: frontend-lint-staged
        name: Run frontend lint staged
        entry: bash -c 'cd frontend && npx lint-staged --no-stash --quiet'
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: frontend-svelte-checks
        name: Run frontend check
        entry: bash -c 'cd frontend && npm run check'
        language: system
